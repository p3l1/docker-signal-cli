name: build

# Woechentlich, damit Sicherheitsstaende der JRE und neue signal-cli-Releases
# ohne Zutun im Image landen.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # Die Fassung kommt aus dem Upstream-Release, nicht aus dem Dockerfile -
      # sonst baut der woechentliche Lauf immer dieselbe Version.
      - name: Resolve the latest signal-cli release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/AsamK/signal-cli/releases/latest --jq .tag_name | sed 's/^v//')
          [ -n "$version" ] || { echo "Keine Version ermittelt" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "signal-cli $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          build-args: SIGNAL_CLI_VERSION=${{ steps.upstream.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          # Ohne das traegt der Manifest-Index zusaetzlich einen
          # unknown/unknown-Eintrag, der Image-Pruefungen verwirrt.
          provenance: false
          tags: |
            ghcr.io/p3l1/signal-cli:${{ steps.upstream.outputs.version }}
            ghcr.io/p3l1/signal-cli:${{ steps.upstream.outputs.version }}-${{ steps.upstream.outputs.date }}
            ghcr.io/p3l1/signal-cli:latest

      - name: Smoke-test the arm64 image
        run: |
          docker run --rm --platform linux/arm64 \
            ghcr.io/p3l1/signal-cli:${{ steps.upstream.outputs.version }} --version
